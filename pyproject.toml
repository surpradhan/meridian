[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian"
version = "0.1.0"
description = "Intelligent Data Navigation Platform - Multi-agent system for AI-powered data queries"
readme = "docs/README.md"
license = {text = "MIT"}
authors = [
    {name = "MERIDIAN Team", email = "team@meridian-ai.com"}
]
keywords = ["ai", "agents", "langchain", "data-navigation", "analytics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.49.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "langchain-openai>=1.3.2",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.5",
    "openai>=2.41.1",
    "tenacity>=9.1.4",
    "sqlalchemy>=2.0.50",
    "pandas>=2.1.2",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "python-json-logger>=2.0.7",
    # Auth/security floors kept in sync with requirements.txt
    "python-jose[cryptography]>=3.5.0",
    "bcrypt>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=26.5.1",
    "isort>=8.0.1",
    "flake8>=6.1.0",
    "mypy>=2.1.0",
    "pre-commit>=3.5.0",
    "ipython>=9.14.1",
]
observability = [
    "opentelemetry-api>=1.42.1",
    "opentelemetry-sdk>=1.42.1",
    "opentelemetry-exporter-trace-jaeger>=1.21.0",
]
redis = [
    "redis>=5.0.0",
    "langchain-redis>=0.1.0",
]
prod = [
    "gunicorn>=23.0.0",
    "prometheus-client>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/meridian-ai/meridian"
Documentation = "https://meridian-ai.com/docs"
Repository = "https://github.com/meridian-ai/meridian.git"
Issues = "https://github.com/meridian-ai/meridian/issues"

[tool.setuptools]
packages = ["app", "tests"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app"]
known_third_party = ["langchain", "fastapi", "pydantic"]
skip_gitignore = true

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
warn_return_any = false
exclude = [
    "venv/",
    "tests/",
    "migrations/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--disable-warnings",
]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "e2e: end-to-end tests",
    "slow: slow tests",
]
