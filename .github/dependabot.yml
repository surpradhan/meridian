version: 2
updates:
  # Python dependencies (base/dev/prod all chain from requirements.txt)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      # Batch the langchain integration packages so their coordinated bumps land
      # as one reviewable PR rather than several conflicting ones.
      langchain:
        patterns:
          - "langchain*"
          - "langsmith"
      # Patch/minor bumps for everything else can ride together.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by the workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
