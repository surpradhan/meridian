name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: test
          POSTGRES_DB: meridian_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with flake8
        run: |
          # Critical syntax errors.
          flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Full style/lint gate — BLOCKING. Cyclomatic complexity (C901) is
          # intentionally not enforced here; it's reported below for visibility.
          flake8 app tests --count --max-line-length=127 --statistics
          # Complexity report — non-blocking (refactoring the flagged functions
          # is tracked separately).
          flake8 app tests --count --select=C901 --max-complexity=10 --exit-zero --statistics

      - name: Type check with mypy
        run: mypy app --ignore-missing-imports

      - name: Run pytest
        env:
          DATABASE_URL: postgresql://meridian:test@localhost:5432/meridian_test
        run: pytest tests/ -v --cov=app --cov-report=xml --cov-fail-under=75

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install security tools
        run: pip install pip-audit==2.7.3 bandit==1.7.9

      # Dependency vulnerability audit across base + prod + dev requirements.
      # BLOCKS on any new advisory ID. Only two advisories remain deferred after
      # the langchain/starlette migration (issue #13), each hard-blocked:
      #   - CVE-2026-30922 (pyasn1): python-jose 3.4.0 pins pyasn1<0.5.0, so it
      #     can't be bumped without replacing the JWT library.
      #   - CVE-2025-71176 (pytest): the fix is pytest 9.x, which cascades into
      #     pytest-asyncio; dev-only, not shipped — deferred.
      # Caveat: pip-audit's --ignore-vuln matches by advisory ID globally, not
      # per package+version, so a *new* package later tripping a listed ID would
      # also be suppressed.
      - name: Dependency audit (pip-audit)
        run: |
          pip-audit -r requirements.txt -r requirements-prod.txt -r requirements-dev.txt \
            --ignore-vuln CVE-2026-30922 \
            --ignore-vuln CVE-2025-71176

      # Static analysis on application code. Blocks on medium+ severity findings
      # at medium+ confidence (low-confidence/low-severity are reported elsewhere).
      - name: SAST (bandit)
        run: bandit -r app --severity-level medium --confidence-level medium

      # Secret scan over the full git history (CLI; no license required).
      # The release tarball's SHA-256 is pinned and verified before extraction
      # so a tampered/MITM'd asset can't execute an arbitrary binary in CI.
      - name: Secret scan (gitleaks)
        run: |
          GITLEAKS_VERSION=8.18.4
          GITLEAKS_SHA256=ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xz -C /tmp -f /tmp/gitleaks.tgz gitleaks
          /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --exit-code 1 --no-banner

  build:
    needs: [test, security]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: meridian:latest
