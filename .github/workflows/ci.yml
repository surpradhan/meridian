name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: test
          POSTGRES_DB: meridian_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with flake8
        run: |
          flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Quality pass is non-blocking for now; tightening this gate (and the
          # mypy gate below) is tracked as a separate cleanup effort.
          flake8 app tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Type check with mypy
        run: mypy app --ignore-missing-imports || true

      - name: Run pytest
        env:
          DATABASE_URL: postgresql://meridian:test@localhost:5432/meridian_test
        run: pytest tests/ -v --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install security tools
        run: pip install pip-audit==2.7.3 bandit==1.7.9

      # Dependency vulnerability audit. This BLOCKS on any new vulnerability.
      # The --ignore-vuln list below is the set of known-unfixable-without-a-
      # major-upgrade advisories (langchain ecosystem + deep starlette/pyasn1),
      # deliberately deferred to the dependency-migration effort. Anything NOT
      # on this list fails the build, so newly introduced vulns are caught.
      - name: Dependency audit (pip-audit)
        run: |
          pip-audit -r requirements.txt -r requirements-prod.txt \
            --ignore-vuln CVE-2024-7774 \
            --ignore-vuln CVE-2024-8309 \
            --ignore-vuln PYSEC-2024-118 \
            --ignore-vuln CVE-2024-2965 \
            --ignore-vuln CVE-2024-3095 \
            --ignore-vuln CVE-2024-5998 \
            --ignore-vuln CVE-2025-6984 \
            --ignore-vuln CVE-2024-10940 \
            --ignore-vuln CVE-2025-65106 \
            --ignore-vuln CVE-2025-68664 \
            --ignore-vuln CVE-2026-26013 \
            --ignore-vuln CVE-2026-40087 \
            --ignore-vuln CVE-2026-44843 \
            --ignore-vuln PYSEC-2026-76 \
            --ignore-vuln CVE-2025-6985 \
            --ignore-vuln PYSEC-2026-77 \
            --ignore-vuln PYSEC-2026-83 \
            --ignore-vuln CVE-2026-41182 \
            --ignore-vuln CVE-2026-45134 \
            --ignore-vuln CVE-2026-30922 \
            --ignore-vuln CVE-2025-54121 \
            --ignore-vuln CVE-2025-62727 \
            --ignore-vuln PYSEC-2026-161

      # Static analysis on application code. Blocks on medium+ severity findings
      # at medium+ confidence (low-confidence/low-severity are reported elsewhere).
      - name: SAST (bandit)
        run: bandit -r app --severity-level medium --confidence-level medium

      # Secret scan over the full git history (CLI; no license required).
      - name: Secret scan (gitleaks)
        run: |
          GITLEAKS_VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --exit-code 1 --no-banner

  build:
    needs: [test, security]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: meridian:latest
