[mypy]
python_version = 3.11
warn_return_any = False
warn_unused_configs = True
disallow_untyped_defs = False
disallow_untyped_calls = False
disallow_incomplete_defs = False
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
strict_optional = True

[mypy-tests.*]
ignore_errors = True

[mypy-app.database.models]
ignore_errors = True

# langraph_orchestrator is currently dead code: a `langraph` import typo means
# the StateGraph path never loads, so its type errors reference an inactive
# branch. Re-enabling or removing it is tracked in issue #32.
[mypy-app.agents.langraph_orchestrator]
ignore_errors = True

[mypy-sqlalchemy.*]
ignore_missing_imports = True

[mypy-fastapi.*]
ignore_missing_imports = True

[mypy-pydantic.*]
ignore_missing_imports = True
