[mypy]
python_version = 3.11
warn_return_any = False
warn_unused_configs = True
disallow_untyped_defs = False
disallow_untyped_calls = False
disallow_incomplete_defs = False
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
strict_optional = True

[mypy-tests.*]
ignore_errors = True

[mypy-app.database.models]
ignore_errors = True

# The LangraphOrchestrator class runs, but its StateGraph branch is dead: a
# `langraph` import typo (package is `langgraph`, and neither is installed) keeps
# LANGRAPH_AVAILABLE False, so the graph node methods (incl. a stale validator
# call) are never reached — only the direct router/agent fallback executes. The
# suppressed errors all sit in that dead branch. Re-enabling/removing it (and the
# stale validate() call it hides) is tracked in issue #32.
[mypy-app.agents.langraph_orchestrator]
ignore_errors = True

# redis 5.x exposes async/sync union return types (e.g. `Awaitable[T] | T`) that
# mypy 2.x validates strictly even when the synchronous `Redis` client is used.
# The `Optional[Redis]` client annotation and availability-probe import pattern
# also generate spurious [assignment] / [unused-ignore] errors that don't reflect
# real bugs.  All redis-related type issues are suppressed here; the module is
# integration-tested end-to-end (unit tests mock the client).
[mypy-app.cache.manager]
ignore_errors = True

[mypy-sqlalchemy.*]
ignore_missing_imports = True

[mypy-fastapi.*]
ignore_missing_imports = True

[mypy-pydantic.*]
ignore_missing_imports = True
